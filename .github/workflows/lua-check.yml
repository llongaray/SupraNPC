name: Lua 5.1 syntax and unit tests

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check B42 layout and syntax
        run: |
          test -f 42/mod.info
          test -d common
          test -f 42/media/lua/shared/SupraNPC/Orders.lua
          test -f 42/media/lua/shared/SupraNPC/Config.lua
          # Regressao de seguranca: jamais criar NPC a partir de IsoZombie.
          if grep -R -F 'addZombiesInOutfit(' 42/media/lua/client --include='*.lua'; then
            echo "API de zumbis nao pode ser usada como spawn de NPC"
            exit 1
          fi
          find 42/media/lua -name '*.lua' -type f -print0 | xargs -0 -n 1 luac5.1 -p
      - name: Unit tests (game-independent logic)
        run: |
          lua5.1 tests/roster_spec.lua
          lua5.1 tests/team_flow_spec.lua
          lua5.1 tests/spawn_proxy_spec.lua
          lua5.1 tests/npc_combat_flags_spec.lua
          lua5.1 tests/npc_recovery_spec.lua
          lua5.1 tests/renderer_spec.lua
          lua5.1 tests/orders_engine_spec.lua
          lua5.1 tests/config_spec.lua
          lua5.1 tests/nav_monitor_spec.lua
          lua5.1 tests/wardrobe_spec.lua
          lua5.1 tests/wardrobe_visual_spec.lua
          lua5.1 tests/health_spec.lua
          lua5.1 tests/npc_controller_spec.lua
          lua5.1 tests/movement_behavior_spec.lua
          lua5.1 tests/navigation_obstacle_spec.lua
          lua5.1 tests/territory_spec.lua
          lua5.1 tests/map_knowledge_spec.lua
          lua5.1 tests/movement_style_spec.lua
          lua5.1 tests/speech_spec.lua
          lua5.1 tests/npc_defense_spec.lua
          lua5.1 tests/stance_policy_spec.lua
          lua5.1 tests/aggressive_pulse_spec.lua
          lua5.1 tests/combat_tactics_spec.lua
          lua5.1 tests/native_attack_spec.lua
          lua5.1 tests/voice_commands_spec.lua
          lua5.1 tests/voice_hotkey_spec.lua
          lua5.1 tests/perception_spec.lua
          lua5.1 tests/risk_combat_spec.lua
          lua5.1 tests/defense_controller_integration_spec.lua
